# Content for the /service/ page (_pages/service.md).
# Three sections: events organized, reviewing, awards & grants.
# Every field except `title`/`name` is optional -- omit what does not apply.

events_organized:
  - title: "CSS Workshop: AI and Society"
    url: https://www.iris.uni-stuttgart.de/news/CSS-Workshop-AI-and-Society/
    role: Co-organizer
    venue: University of Stuttgart
    year: 2026
    description: >-
      Brought together researchers from IRIS, the IMS, and CSS in Stuttgart and the Chair of Data Science in the Economic and Social Sciences at the
      University of Mannheim to explore how computational approaches can support the study of social, cultural, and institutional questions about AI.

  - title: KnitTogether'25
    url: https://knittogether.github.io/kt25/
    role: Co-organizer
    venue: 1st European CL Research Summit for Junior Researchers
    year: 2025
    description: >-
      A week-long summit on *Bias in NLP and its Societal Impacts* in Wildhaus, Switzerland, bringing together 25 early-career researchers.

